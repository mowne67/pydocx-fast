[project]
name = "docx-speedups"
version = "0.1.0"
description = "Drop-in performance fixes for python-docx"
requires-python = ">=3.9"
dependencies = ["python-docx>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["docx_speedups.py"]
